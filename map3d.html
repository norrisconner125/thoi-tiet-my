<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bản Đồ 3D Thời Tiết</title>
<meta name="description" content="Bản đồ 3D kiểu nhà đài: cảnh báo NWS dựng khối, cột số liệu quan trắc, radar trên địa hình.">
<meta name="theme-color" content="#0b1726">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: bản đồ 3D toàn màn hình kiểu phòng thu; thanh điều khiển trên cùng, nhãn đài góc trái,
   thanh chữ (lower third) cạnh dưới, chú giải góc phải. Giao diện tối cố định như màn hình TV. */
:root {
  --bg: #0b1726; --panel: rgb(11 23 38 / .86); --line: rgb(255 255 255 / .14); --fg: #eef3f9; --muted: #9fb2c8;
  --accent: #3d8bfd; --live: #e53935;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f-body); overflow: hidden; }
#map { position: absolute; inset: 0; }

.bar {
  position: absolute; z-index: 5; top: 0; left: 0; right: 0;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  background: linear-gradient(180deg, rgb(6 14 24 / .92), rgb(6 14 24 / .65) 70%, transparent);
}
.bar a { color: #9cc4ff; text-decoration: none; font-weight: 500; white-space: nowrap; }
.bar h1 { margin: 0; font: 800 22px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.bar .grow { flex: 1; }
select, button {
  padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: rgb(255 255 255 / .08);
  color: var(--fg); font: 500 13px var(--f-body); cursor: pointer;
}
select option { background: #13243a; }
button:hover, select:hover { border-color: #9cc4ff; }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
button.play[aria-pressed="true"] { background: var(--live); border-color: var(--live); }
:focus-visible { outline: 2px solid #9cc4ff; outline-offset: 2px; }
.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.chk input { accent-color: var(--accent); }
.more { display: contents; }

/* Nhãn đài */
.bug { position: absolute; z-index: 4; left: max(16px, env(safe-area-inset-left)); top: 74px; display: flex; align-items: stretch; font: 700 13px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 2px 10px rgb(0 0 0 / .4); }
.bug span { padding: 6px 9px; }
.bug .a { background: var(--live); }
.bug .b { background: rgb(6 14 24 / .9); font-family: var(--f-data); font-weight: 500; letter-spacing: 0; }
.status { position: absolute; z-index: 4; left: max(16px, env(safe-area-inset-left)); top: 144px; font-size: 12px; color: var(--muted); text-shadow: 0 1px 3px #000; max-width: 70vw; }

/* Thanh chữ phía dưới (lower third) */
.l3 {
  position: absolute; z-index: 4; left: max(16px, env(safe-area-inset-left)); bottom: max(28px, calc(env(safe-area-inset-bottom) + 16px));
  width: min(640px, calc(100vw - 32px)); display: grid; grid-template-columns: 10px minmax(0, 1fr);
  background: var(--panel); border-radius: 6px; overflow: hidden; box-shadow: 0 6px 24px rgb(0 0 0 / .5);
  transition: transform .45s cubic-bezier(.2, .8, .2, 1), opacity .45s;
}
.l3[hidden] { display: grid !important; transform: translateY(24px); opacity: 0; pointer-events: none; }
.l3 .stripe { background: var(--c, var(--live)); }
.l3 .body { padding: 10px 14px 12px; min-width: 0; }
.l3 .kicker { font: 600 12px var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.l3 .title { font: 800 clamp(24px, 4.2vw, 36px)/1.02 var(--f-display); text-transform: uppercase; letter-spacing: .01em; margin: 2px 0 4px; text-wrap: balance; }
.l3 .area { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.l3 .time { font: 500 12px var(--f-data); color: var(--muted); margin-top: 4px; }

/* Chú giải */
.legend {
  position: absolute; z-index: 4; right: max(16px, env(safe-area-inset-right)); bottom: max(28px, calc(env(safe-area-inset-bottom) + 16px));
  width: 250px; max-height: 46vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 12px;
}
.legend h3 { margin: 0 0 6px; font: 700 13px var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.legend h3 + h3, .legend .sec { margin-top: 10px; }
.legend .row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 7px; align-items: center; padding: 2px 0; cursor: pointer; }
.legend .row:hover { color: #fff; text-decoration: underline; }
.legend .sw { width: 12px; height: 12px; border-radius: 2px; }
.legend .n { font-family: var(--f-data); color: var(--muted); }
.scale { display: flex; height: 10px; border-radius: 3px; overflow: hidden; }
.scale i { flex: 1; }
.scale-lab { display: flex; justify-content: space-between; font: 11px var(--f-data); color: var(--muted); margin-top: 2px; }
.legend .note { color: var(--muted); margin: 6px 0 0; }
.legend-toggle { display: none; }
@media (max-width: 760px) {
  .bar h1 { font-size: 18px; }
  .legend { width: auto; left: max(16px, env(safe-area-inset-left)); bottom: auto; top: 136px; max-height: 40vh; }
  .legend.collapsed > :not(.legend-toggle) { display: none; }
  .legend-toggle { display: block; width: 100%; margin-bottom: 6px; }
  .bug { top: auto; bottom: calc(max(28px, calc(env(safe-area-inset-bottom) + 16px)) + 150px); }
  .status { top: 112px; }
}

/* Nhãn số trên cột */
.val { font: 600 11px/1 var(--f-data); padding: 2px 4px; border-radius: 3px; box-shadow: 0 0 0 1px rgb(0 0 0 / .45); white-space: nowrap; pointer-events: none; }
.maplibregl-popup-content { background: #fff; color: #142233; font: 13px/1.4 var(--f-body); max-height: 50vh; overflow: auto; }
.pop h4 { margin: 0 0 4px; font-size: 14px; }
.pop .a { border-left: 4px solid; padding: 2px 0 6px 8px; margin: 6px 0; }
.pop small { color: #555; }
.pop details p { white-space: pre-line; max-height: 160px; overflow: auto; margin: 4px 0; font-size: 12px; }
.pop table { border-collapse: collapse; font-size: 12px; }
.pop td { padding: 1px 8px 1px 0; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
/* Thanh thời gian radar động */
.rbar { position: absolute; z-index: 4; left: max(16px, env(safe-area-inset-left)); top: 106px; display: flex; align-items: center; gap: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: 600 13px var(--f-data); }
.rbar button { padding: 2px 8px; font-size: 12px; }
.rbar input { width: 140px; accent-color: var(--accent); }
.rbar .lab { font: 700 12px var(--f-display); letter-spacing: .1em; color: var(--muted); }
.rbar .now { color: #ffd54f; }

/* Nhãn điểm dự báo bão */
.spt { display: flex; align-items: center; gap: 5px; pointer-events: none; transform: translateY(-2px); }
.spt b { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 11px var(--f-data); border: 2px solid #fff; box-shadow: 0 1px 6px rgb(0 0 0 / .6); }
.spt span { font: 600 12px var(--f-body); color: #fff; text-shadow: 0 1px 3px #000, 0 0 6px #000; white-space: nowrap; }
.spt.now b { width: 30px; height: 30px; font-size: 12px; }

/* Băng chữ chạy (chế độ trình chiếu) */
.ticker { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; height: 42px; display: none; align-items: stretch; background: rgb(6 14 24 / .94); border-top: 2px solid var(--live);
  padding-bottom: env(safe-area-inset-bottom); }
.ticker .tl { flex: none; display: grid; place-items: center; padding: 0 14px; background: var(--live); font: 800 16px var(--f-display); letter-spacing: .1em; text-transform: uppercase; }
.ticker .tv { flex: 1; overflow: hidden; position: relative; }
.ticker .tt { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; white-space: nowrap; font: 600 18px var(--f-display); letter-spacing: .03em; will-change: transform; animation: crawl var(--dur, 60s) linear infinite; }
.ticker .tt i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 8px 0 28px; }
@keyframes crawl { from { transform: translateX(var(--from, 100vw)); } to { transform: translateX(-100%); } }

/* Chế độ trình chiếu: ẩn thanh điều khiển, chữ to, băng chữ chạy */
body.present .bar, body.present .maplibregl-ctrl-top-right, body.present .status, body.present .legend { display: none; }
body.present .ticker { display: flex; }
body.present .bug { top: max(20px, env(safe-area-inset-top)); left: max(24px, env(safe-area-inset-left)); bottom: auto; font-size: 17px; }
body.present .rbar { top: calc(max(20px, env(safe-area-inset-top)) + 40px); left: max(24px, env(safe-area-inset-left)); }
body.present .rbar button, body.present .rbar input { display: none; }
body.present .l3 { bottom: 60px; left: max(24px, env(safe-area-inset-left)); width: min(820px, calc(100vw - 48px)); }
body.present .l3 .title { font-size: clamp(30px, 5vw, 56px); }
body.present .l3 .area { font-size: 18px; }
body.present .l3 .time { font-size: 15px; }
body.present .maplibregl-ctrl-attrib { display: none; }
body.present.idle, body.present.idle * { cursor: none !important; }
.exitp { position: absolute; z-index: 6; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); display: none; background: var(--panel); }
body.present .exitp { display: block; opacity: 1; transition: opacity .4s; }
body.present.idle .exitp { opacity: 0; pointer-events: none; }
.startp { position: absolute; inset: 0; z-index: 7; display: grid; place-items: center; background: rgb(6 14 24 / .7); }
.startp button { font: 800 26px var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 18px 30px; background: var(--live); border-color: var(--live); }
@media (prefers-reduced-motion: reduce) { .l3 { transition: none; } .ticker .tt { animation-duration: calc(var(--dur, 60s) * 2); } }
</style>
</head>
<body>
<div id="map" role="region" aria-label="Bản đồ 3D thời tiết"></div>

<header class="bar">
  <a href="./">← Thời Tiết Mỹ</a>
  <a href="map.html" id="link2d">Bản đồ 2D</a>
  <h1>Bản đồ 3D</h1>
  <span class="grow"></span>
  <select id="region" aria-label="Chọn khu vực"></select>
  <select id="metric" aria-label="Cột số liệu">
    <option value="t">Cột: Nhiệt độ</option>
    <option value="td">Cột: Điểm sương</option>
    <option value="wspd">Cột: Gió</option>
    <option value="wgst">Cột: Gió giật</option>
    <option value="vis">Cột: Tầm nhìn</option>
    <option value="altim">Cột: Áp suất</option>
    <option value="none">Không hiện cột</option>
  </select>
  <select id="basemap" aria-label="Nền bản đồ">
    <option value="sat">Nền: Vệ tinh</option>
    <option value="gray">Nền: Bản đồ</option>
  </select>
  <label class="chk"><input type="checkbox" id="lyrAlerts" checked> Cảnh báo</label>
  <select id="radarMode" aria-label="Radar">
    <option value="off">Radar: Tắt</option>
    <option value="now">Radar: Hiện tại</option>
    <option value="60">Radar động: 1 giờ</option>
    <option value="120">Radar động: 2 giờ</option>
    <option value="180">Radar động: 3 giờ</option>
  </select>
  <label class="chk"><input type="checkbox" id="lyrStorms" checked> Bão NHC</label>
  <label class="chk"><input type="checkbox" id="lyrTerrain" checked> Địa hình</label>
  <label class="chk">Độ cao khối <input type="range" id="scale" min="0.4" max="3" step="0.1" value="1" aria-label="Độ cao khối"></label>
  <button type="button" id="orbit" aria-pressed="false">Xoay</button>
  <button type="button" id="tour" class="play" aria-pressed="false">▶ Dẫn chương trình</button>
  <button type="button" id="present">⛶ Trình chiếu</button>
</header>

<div class="bug" aria-hidden="true"><span class="a">NWS · NOAA</span><span class="b" id="clock"></span></div>
<div class="status" id="status" role="status"></div>
<div class="rbar" id="rbar" hidden>
  <span class="lab">Radar</span><span id="rtime"></span>
  <button type="button" id="rplay" aria-label="Tạm dừng radar động">⏸</button>
  <input type="range" id="rslider" min="0" max="0" value="0" aria-label="Chọn thời điểm radar">
</div>
<div class="ticker" id="ticker" aria-hidden="true"><div class="tl">Cảnh báo</div><div class="tv"><div class="tt" id="ttrack"></div></div></div>
<button type="button" class="exitp" id="exitPresent">Thoát trình chiếu (Esc)</button>

<section class="l3" id="l3" hidden aria-live="polite">
  <div class="stripe"></div>
  <div class="body">
    <div class="kicker" id="l3k"></div>
    <div class="title" id="l3t"></div>
    <div class="area" id="l3a"></div>
    <div class="time" id="l3m"></div>
  </div>
</section>

<aside class="legend" id="legend">
  <button type="button" class="legend-toggle" id="legendToggle">Chú giải</button>
  <div id="legendBody"></div>
</aside>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="noaa-common.js"></script>
<script>
// ================= BẢN ĐỒ 3D =================
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
const MRMS = ['conus', 'alaska', 'hawaii', 'carib', 'guam'];
const wms = ws => `https://opengeo.ncep.noaa.gov/geoserver/${ws}/${ws}_bref_qcd/ows?service=WMS&request=GetMap&version=1.3.0&layers=${ws}_bref_qcd&styles=&format=image/png&transparent=true&width=256&height=256&crs=EPSG:3857&bbox={bbox-epsg-3857}`;
const DEM = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
const EMPTY = { type: 'FeatureCollection', features: [] };
// Hệ số phóng chiều cao theo mức zoom: nhìn toàn quốc ×6, nhìn một bang ×2.5, nhìn gần ×1
const ZOOMK = v => ['interpolate', ['linear'], ['zoom'], 3, ['*', 6, v], 6, ['*', 2.5, v], 9, v];

const setStatus = m => { $('status').textContent = m || ''; };
const tick = () => { $('clock').textContent = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' (giờ máy bạn)'; };
tick(); setInterval(tick, 15000);

if (!window.maplibregl || !maplibregl.supported?.({ failIfMajorPerformanceCaveat: false }) && !document.createElement('canvas').getContext('webgl2')) {
  $('map').innerHTML = '<div class="nogl">Trình duyệt hoặc máy này không hỗ trợ WebGL nên không hiển thị được bản đồ 3D. Hãy dùng <a href="map.html" style="color:#9cc4ff">bản đồ 2D</a>.</div>';
  throw new Error('Không có WebGL');
}

const map = new maplibregl.Map({
  container: 'map',
  center: [-97, 38.5], zoom: 3.4, pitch: 50, bearing: -12, maxPitch: 80,
  attributionControl: { compact: true },
  style: {
    version: 8,
    sources: {
      sat: { type: 'raster', tiles: [ESRI + 'World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize: 256, maxzoom: 18, attribution: 'Ảnh vệ tinh: Esri, Maxar, Earthstar Geographics' },
      gray: { type: 'raster', tiles: [ESRI + 'Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}'], tileSize: 256, maxzoom: 16, attribution: 'Nền: Esri, HERE, Garmin, © OpenStreetMap' },
      labels: { type: 'raster', tiles: [ESRI + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'], tileSize: 256, maxzoom: 16 },
      dem: { type: 'raster-dem', tiles: [DEM], encoding: 'terrarium', tileSize: 256, maxzoom: 14, attribution: 'Độ cao: AWS Terrain Tiles' },
      demHill: { type: 'raster-dem', tiles: [DEM], encoding: 'terrarium', tileSize: 256, maxzoom: 14 },
      ...Object.fromEntries(MRMS.map(ws => [`radar-${ws}`, { type: 'raster', tiles: [wms(ws)], tileSize: 256, ...(ws === 'conus' ? { attribution: 'Radar: NOAA/NCEP MRMS' } : {}) }])),
      alerts: { type: 'geojson', data: EMPTY, attribution: 'Cảnh báo: NWS' },
      cols: { type: 'geojson', data: EMPTY, attribution: 'Số liệu: NOAA/NWS AWC (METAR)' },
      storm: { type: 'geojson', data: EMPTY, attribution: 'Bão: NOAA/NHC' }
    },
    layers: [
      { id: 'sat', type: 'raster', source: 'sat', paint: { 'raster-saturation': -0.25, 'raster-brightness-max': 0.85 } },
      { id: 'gray', type: 'raster', source: 'gray', layout: { visibility: 'none' } },
      { id: 'hill', type: 'hillshade', source: 'demHill', paint: { 'hillshade-exaggeration': 0.35, 'hillshade-shadow-color': '#0b1220' } },
      ...MRMS.map(ws => ({ id: `radar-${ws}`, type: 'raster', source: `radar-${ws}`, layout: { visibility: 'none' }, paint: { 'raster-opacity': 0.7 } })),
      { id: 'alerts-line', type: 'line', source: 'alerts', paint: { 'line-color': ['get', 'color'], 'line-width': 1.5, 'line-opacity': 0.9 } },
      { id: 'labels', type: 'raster', source: 'labels', paint: { 'raster-opacity': 0.9 } },
      { id: 'alerts-3d', type: 'fill-extrusion', source: 'alerts', paint: {
          'fill-extrusion-color': ['get', 'color'], 'fill-extrusion-base': ZOOMK(['get', 'base']), 'fill-extrusion-height': ZOOMK(['get', 'top']),
          'fill-extrusion-opacity': 0.62, 'fill-extrusion-vertical-gradient': true } },
      { id: 'cone-3d', type: 'fill-extrusion', source: 'storm', filter: ['==', ['get', 'kind'], 'cone'], paint: {
          'fill-extrusion-color': '#ffffff', 'fill-extrusion-base': 0, 'fill-extrusion-height': ZOOMK(1200), 'fill-extrusion-opacity': 0.28 } },
      { id: 'cone-line', type: 'line', source: 'storm', filter: ['==', ['get', 'kind'], 'cone'], paint: { 'line-color': '#ffffff', 'line-width': 2, 'line-opacity': 0.9 } },
      { id: 'track-line', type: 'line', source: 'storm', filter: ['==', ['get', 'kind'], 'track'], layout: { 'line-cap': 'round' }, paint: { 'line-color': '#ffffff', 'line-width': 3, 'line-dasharray': [1.5, 1.2] } },
      { id: 'eye-3d', type: 'fill-extrusion', source: 'storm', filter: ['==', ['get', 'kind'], 'eye'], paint: {
          'fill-extrusion-color': ['get', 'color'], 'fill-extrusion-base': 0, 'fill-extrusion-height': ZOOMK(['get', 'h']), 'fill-extrusion-opacity': 0.95 } },
      { id: 'cols-3d', type: 'fill-extrusion', source: 'cols', paint: {
          'fill-extrusion-color': ['get', 'color'], 'fill-extrusion-base': 0, 'fill-extrusion-height': ZOOMK(['get', 'h']), 'fill-extrusion-opacity': 0.92 } }
    ],
    terrain: { source: 'dem', exaggeration: 1.5 }
  }
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
map.on('load', () => {
  map.setSky?.({ 'sky-color': '#0d2440', 'horizon-color': '#3b6a9a', 'fog-color': '#0b1726', 'sky-horizon-blend': 0.6, 'horizon-fog-blend': 0.5, 'fog-ground-blend': 0.2 });
});
map.on('error', e => console.warn('Bản đồ:', e?.error?.message || e));

// ---------- Trạng thái ----------
let region = 'US', gen = 0, alerts = [], obs = [], scaleK = 1;
let metric = store.get('map3dMetric') || 't';

// ---------- Cảnh báo dựng khối ----------
// Chiều cao (mét) theo mức nguy hiểm: cảnh báo hàng đầu cao nhất, rồi Warning, Watch, Advisory
// (chiều cao gốc ở mức zoom gần; khi nhìn xa, khối được phóng cao thêm để vẫn thấy rõ — xem ZOOMK)
function alertHeight(a) {
  if (a.rank < 100) return 9000 - a.rank * 150;
  return a.rank === 100 ? 5500 : a.rank === 200 ? 3800 : a.rank === 300 ? 2500 : 1800;
}
function rebuildAlerts() {
  const feats = [], stack = new Map();
  for (const a of alerts) {
    const h = alertHeight(a) * scaleK;
    for (const { key, g } of a.geoms) {

      const base = key ? (stack.get(key) || 0) : 0;

}
async function loadAlerts() {
  const my = ++gen;
  setStatus('Đang tải cảnh báo NWS…');
  const url = region === 'US' ? `${NWS}/alerts/active?status=actual` : `${NWS}/alerts/active?status=actual&area=${region}`;
  let data;
  try { data = await nws(url); } catch (e) { setStatus('Không tải được cảnh báo NWS (' + e.message + ').'); return; }
  if (my !== gen) return;
  alerts = data.features.map(f => ({ id: f.id, p: f.properties, rank: rank(f.properties.event), color: eventColor(f.properties.event), geoms: f.geometry ? [{ key: null, g: f.geometry }] : [] }))
    .sort((a, b) => a.rank - b.rank);
  rebuildAlerts(); renderLegend(); renderTicker();
  setStatus(region === 'US' ? 'Toàn quốc: hiện các cảnh báo có đa giác riêng. Chọn một bang để thấy đủ mọi vùng cảnh báo.' : '');
  if (region === 'US') return;
  const jobs = [];
  alerts.forEach(a => { if (!a.geoms.length) (a.p.affectedZones || []).forEach(z => jobs.push([a, z])); });
  let done = 0;
  await pool(jobs, 6, async ([a, z]) => {
    const g = await getZone(z);
    if (my !== gen) return;
    if (g) a.geoms.push({ key: z, g });
    done++;
    if (done % 8 === 0 || done === jobs.length) { rebuildAlerts(); setStatus(done < jobs.length ? `Đang dựng vùng cảnh báo ${done}/${jobs.length}…` : ''); }

}

// ---------- Cột số liệu 3D ----------
function hexagon(lon, lat, rKm) {
  const ring = [], kLat = rKm / 111.32, kLon = rKm / (111.32 * Math.cos(lat * Math.PI / 180));
  for (let i = 0; i <= 6; i++) { const t = (i % 6) * Math.PI / 3; ring.push([lon + kLon * Math.cos(t), lat + kLat * Math.sin(t)]); }
  return { type: 'Polygon', coordinates: [ring] };
}
let valMarkers = [];
function rebuildCols() {
  valMarkers.forEach(m => m.remove()); valMarkers = [];
  if (metric === 'none') { map.getSource('cols')?.setData(EMPTY); renderLegend(); return; }
  const M = METRICS[metric], lo = M.stops[0][0], hi = M.stops[M.stops.length - 1][0];
  const r = region === 'US' ? 20 : 9;
  const feats = obs.filter(o => M.get(o) != null).map(o => {
    const v = M.get(o), k = Math.max(0, Math.min(1, (v - lo) / (hi - lo)));
    // Tầm nhìn và áp suất thấp mới đáng chú ý: cột cao khi giá trị nhỏ
    const kk = metric === 'vis' || metric === 'altim' ? 1 - k : k;
    return { type: 'Feature', geometry: hexagon(o.lon, o.lat, r), properties: { id: o.id, color: colorAt(M.stops, v), h: (800 + kk * (region === 'US' ? 12000 : 9000)) * scaleK } };
  });
  map.getSource('cols')?.setData({ type: 'FeatureCollection', features: feats });
  renderLabels();
  renderLegend();
}
// Nhãn giá trị (thưa dần để không chồng chéo), chỉ khi đã zoom vào
function renderLabels() {
  valMarkers.forEach(m => m.remove()); valMarkers = [];
  if (metric === 'none' || map.getZoom() < 5.2) return;
  const M = METRICS[metric], used = new Set(), cell = 54, b = map.getBounds();
  for (const o of obs) {
    const v = M.get(o); if (v == null || !b.contains([o.lon, o.lat])) continue;
    const p = map.project([o.lon, o.lat]), key = Math.floor(p.x / cell) + ':' + Math.floor(p.y / (cell * .6));
    if (used.has(key)) continue; used.add(key);
    const el = document.createElement('div'), bg = colorAt(M.stops, v);
    el.className = 'val'; el.style.background = bg; el.style.color = textOn(bg); el.textContent = M.fmt(v);
    valMarkers.push(new maplibregl.Marker({ element: el, anchor: 'bottom', offset: [0, -4] }).setLngLat([o.lon, o.lat]).addTo(map));
    if (valMarkers.length > 140) break;

}

  list.forEach(({ g }) => g.type === 'GeometryCollection' ? g.geometries.forEach(x => walk(x.coordinates)) : walk(g.coordinates));
  return w <= e ? [[w, s], [e, n]] : null;
}

}

// ================= BÃO NHC: NÓN DỰ BÁO 3D =================
let storms = [], stormMarkers = [];
const CLS_VI = { TD: 'Áp thấp nhiệt đới', STD: 'Áp thấp cận nhiệt đới', TS: 'Bão nhiệt đới', STS: 'Bão cận nhiệt đới', HU: 'Bão cuồng phong', PTC: 'Xoáy thuận tiềm năng', PC: 'Hậu xoáy thuận' };
// Thang Saffir–Simpson theo sức gió (knot): ký hiệu và màu
function windCat(kt) {
  if (kt == null) return { c: '?', col: '#78909c' };
  if (kt >= 137) return { c: '5', col: '#990099' };
  if (kt >= 113) return { c: '4', col: '#cc0033' };
  if (kt >= 96) return { c: '3', col: '#ff3300' };
  if (kt >= 83) return { c: '2', col: '#ff9933' };
  if (kt >= 64) return { c: '1', col: '#ffcc33' };
  if (kt >= 34) return { c: 'S', col: '#2e9e5b' };
  return { c: 'D', col: '#3b7dd8' };
}
// "Valid at: 2:00 PM EST November 03, 2026" → nhãn tiếng Việt "14h T3 3/11 (EST)"
const TZ = { EST: -5, EDT: -4, CST: -6, CDT: -5, MST: -7, MDT: -6, PST: -8, PDT: -7, AST: -4, ADT: -3, HST: -10, AKST: -9, AKDT: -8, UTC: 0, GMT: 0 };
const MON = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
const WD = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
function nhcTime(desc, fallback) {
  const m = (desc || '').match(/(\d{1,2}):(\d{2})\s*(AM|PM)\s*([A-Z]{2,4})\s+([A-Za-z]+)\s+(\d{1,2}),?\s*(\d{4})/);
  if (!m) return fallback || '';
  let h = +m[1] % 12 + (m[3] === 'PM' ? 12 : 0);
  const mon = MON.indexOf(m[5].toLowerCase()), off = TZ[m[4]] ?? 0;
  if (mon < 0) return fallback || '';
  const local = new Date(Date.UTC(+m[7], mon, +m[6], h, +m[2]));   // giờ địa phương của bão
  return `${h}h${m[2] !== '00' ? m[2] : ''} ${WD[local.getUTCDay()]} ${+m[6]}/${mon + 1} (${m[4]})`;
}
async function loadStorms() {

  try { fc = await (await fetch('data/storm-cones.json?t=' + Math.floor(Date.now() / 300000))).json(); } catch {}
  try { list = (await (await fetch('data/CurrentStorms.json?t=' + Math.floor(Date.now() / 300000))).json()).activeStorms || []; } catch {}
  const feats = (fc?.features || []).filter(f => f.geometry);
  const ids = [...new Set(feats.map(f => f.properties.storm).concat(list.map(s => s.id)))];
  storms = ids.map(id => {
    const info = list.find(s => s.id === id) || {};
    const fs = feats.filter(f => f.properties.storm === id);
    const pts = fs.filter(f => f.properties.kind === 'point');
    const now = info.latitudeNumeric != null ? [info.longitudeNumeric, info.latitudeNumeric] : pts[0]?.geometry.coordinates;
    const kt = info.intensity != null ? +info.intensity : pts[0]?.properties.wind;
    const geoms = fs.map(f => ({ g: f.geometry })).concat(now ? [{ g: { type: 'Point', coordinates: now } }] : []);
    return { id, name: info.name || fs[0]?.properties.name || id.toUpperCase(), info, fs, pts, now, kt, bounds: geoms.length ? geomBounds(geoms) : null };
  });

}

      el.innerHTML = `<b style="background:${w.col}">${w.c}</b><span>${i === 0 ? esc(s.name) + ' · ' : ''}${esc(nhcTime(f.properties.desc, f.properties.label))}</span>`;
      stormMarkers.push(new maplibregl.Marker({ element: el, anchor: 'left', offset: [-12, 0] }).setLngLat(f.geometry.coordinates).addTo(map));
    });
    if (!s.pts.length && s.now) {
      const w = windCat(s.kt), el = document.createElement('div');
      el.className = 'spt now'; el.innerHTML = `<b style="background:${w.col}">${w.c}</b><span>${esc(s.name)}</span>`;

function flyToStorm(s, i) {

  map.flyTo({ center: cam.center, zoom: (cam.zoom ?? 5) - 0.2, pitch: 58, bearing: -20 + (i * 35) % 70, duration: 5000, essential: true, curve: 1.6 });

function showStormL3(s) {
  const w = windCat(s.kt), cls = s.info.classification;
  $('l3').style.setProperty('--c', w.col);
  $('l3k').textContent = `Trung tâm Bão Quốc gia (NHC)${s.info.publicAdvisory?.advNum ? ' · Bản tin số ' + s.info.publicAdvisory.advNum : ''}`;
  $('l3t').textContent = `${CLS_VI[cls] || 'Bão'} ${s.name}${/^[1-5]$/.test(w.c) && cls === 'HU' ? ' · cấp ' + w.c : ''}`;
  $('l3a').textContent = [s.kt != null ? `Gió mạnh nhất ${Math.round(s.kt * 1.15078)} mph (${s.kt} kt)` : '', s.info.pressure ? `áp suất ${s.info.pressure} mb` : '',
    s.info.movementDir != null && s.info.movementSpeed != null ? `di chuyển ${s.info.movementSpeed} mph` : ''].filter(Boolean).join(' · ');

}

// ================= RADAR ĐỘNG =================
// Hiện tại: NOAA MRMS. Vòng lặp: ảnh tổng hợp NEXRAD theo thời gian (WMS-T của Iowa Environmental Mesonet,
// dữ liệu radar NWS), mỗi khung 5–15 phút. Chỉ phủ lục địa Mỹ.
const IEM = t => `https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0q-t.cgi?service=WMS&request=GetMap&version=1.1.1&layers=nexrad-n0q-wmst&styles=&format=image/png&transparent=true&srs=EPSG:3857&width=512&height=512&bbox={bbox-epsg-3857}&time=${new Date(t).toISOString().slice(0, 16)}:00Z`;
let radarMode = 'off', frames = [], fIdx = 0, fTimer, fPlaying = true;
function clearLoop() {
  clearInterval(fTimer);
  frames.forEach((_, i) => { if (map.getLayer('rl' + i)) map.removeLayer('rl' + i); if (map.getSource('rl' + i)) map.removeSource('rl' + i); });
  frames = [];
}
function setRadarMode(mode) {
  radarMode = mode;
  clearLoop();
  MRMS.forEach(ws => map.setLayoutProperty(`radar-${ws}`, 'visibility', mode === 'now' ? 'visible' : 'none'));
  $('rbar').hidden = !/^\d+$/.test(mode);
  if ($('rbar').hidden) return;
  const mins = +mode, step = mins <= 60 ? 5 : mins <= 120 ? 10 : 15;
  // Khung mới nhất: làm tròn 5 phút, lùi 10 phút để chắc chắn dữ liệu đã có
  const end = Math.floor((Date.now() - 10 * 60e3) / 300e3) * 300e3;
  for (let t = end - mins * 60e3; t <= end; t += step * 60e3) frames.push(t);
  frames.forEach((t, i) => {
    map.addSource('rl' + i, { type: 'raster', tiles: [IEM(t)], tileSize: 512, ...(i === 0 ? { attribution: 'Radar động: NWS NEXRAD qua Iowa Environmental Mesonet' } : {}) });
    map.addLayer({ id: 'rl' + i, type: 'raster', source: 'rl' + i, paint: { 'raster-opacity': 0, 'raster-opacity-transition': { duration: 0 }, 'raster-fade-duration': 0 } }, 'alerts-line');
  });
  $('rslider').max = frames.length - 1;
  showFrame(frames.length - 1);
  // Chờ tải ảnh rồi mới chạy; khung cuối dừng lâu hơn
  let hold = 0;
  fTimer = setInterval(() => {
    if (!fPlaying) return;
    if (fIdx === frames.length - 1 && hold++ < 3) return;
    hold = 0;
    showFrame((fIdx + 1) % frames.length);
  }, 650);
}
function showFrame(i) {
  frames.forEach((_, j) => map.getLayer('rl' + j) && map.setPaintProperty('rl' + j, 'raster-opacity', j === i ? 0.75 : 0));
  fIdx = i;
  $('rslider').value = i;
  const t = new Date(frames[i]);
  $('rtime').innerHTML = t.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + (i === frames.length - 1 ? ' <span class="now">mới nhất</span>' : '');
}
$('rplay').onclick = () => { fPlaying = !fPlaying; $('rplay').textContent = fPlaying ? '⏸' : '▶'; $('rplay').setAttribute('aria-label', fPlaying ? 'Tạm dừng radar động' : 'Chạy radar động'); };
$('rslider').oninput = e => { fPlaying = false; $('rplay').textContent = '▶'; showFrame(+e.target.value); };

// ================= CHẾ ĐỘ TRÌNH CHIẾU =================
let presenting = false, wakeLock = null, idleT;
async function enterPresent() {
  presenting = true;
  document.body.classList.add('present');
  try { await document.documentElement.requestFullscreen?.({ navigationUI: 'hide' }); } catch {}
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  if (radarMode === 'off') { $('radarMode').value = '120'; setRadarMode('120'); }
  renderTicker();
  map.resize();
  poke();
  if (!touring) startTour();
}
function exitPresent() {
  presenting = false;
  document.body.classList.remove('present', 'idle');
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  wakeLock?.release?.().catch(() => {}); wakeLock = null;
  stopTour(); hideL3(); map.resize();
}
// Ẩn con trỏ và nút thoát khi không đụng chuột 3 giây
function poke() { document.body.classList.remove('idle'); clearTimeout(idleT); if (presenting) idleT = setTimeout(() => document.body.classList.add('idle'), 3000); }
addEventListener('mousemove', poke); addEventListener('touchstart', poke, { passive: true });
$('present').onclick = enterPresent;
$('exitPresent').onclick = exitPresent;
addEventListener('keydown', e => { if (e.key === 'Escape' && presenting) exitPresent(); });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && presenting) exitPresent(); });
document.addEventListener('visibilitychange', async () => { if (presenting && document.visibilityState === 'visible' && !wakeLock) { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {} } });
// Mở bằng đường dẫn ...map3d.html?present#TX: toàn màn hình cần một cú bấm, nên hiện nút bắt đầu
function offerPresent() {
  const d = document.createElement('div');
  d.className = 'startp';
  d.innerHTML = '<button type="button">▶ Bắt đầu trình chiếu</button>';
  d.querySelector('button').onclick = () => { d.remove(); enterPresent(); };
  document.body.appendChild(d);
}

// Băng chữ chạy: bão + cảnh báo nguy hiểm nhất
function renderTicker() {
  const items = storms.map(s => ({ c: windCat(s.kt).col, t: `${(CLS_VI[s.info.classification] || 'Bão').toUpperCase()} ${s.name.toUpperCase()}${s.kt != null ? ' · gió ' + Math.round(s.kt * 1.15078) + ' mph' : ''}` }))
    .concat(alerts.slice(0, 30).map(a => ({ c: a.color, t: `${eventVi(a.p.event).toUpperCase()} · ${(a.p.areaDesc || '').split(';').slice(0, 4).join(',')}${(a.p.ends || a.p.expires) ? ' · đến ' + fmtTime(a.p.ends || a.p.expires) : ''}` })));
  const tt = $('ttrack');
  tt.innerHTML = items.length ? items.map(x => `<i style="background:${x.c}"></i>${esc(x.t)}`).join('')
    : `<i style="background:#5cc94e"></i>Không có cảnh báo nào đang hiệu lực ${region === 'US' ? 'trên toàn nước Mỹ' : 'tại ' + esc(STATES[region][0])} · Dữ liệu: NOAA / National Weather Service`;
  requestAnimationFrame(() => { tt.style.setProperty('--dur', Math.max(25, (tt.scrollWidth + innerWidth) / 110) + 's'); });
}
sel.onchange = () => setRegion(sel.value);
$('metric').value = metric;
$('metric').onchange = e => { metric = e.target.value; store.set('map3dMetric', metric); rebuildCols(); };
$('basemap').onchange = e => { map.setLayoutProperty('sat', 'visibility', e.target.value === 'sat' ? 'visible' : 'none'); map.setLayoutProperty('gray', 'visibility', e.target.value === 'gray' ? 'visible' : 'none'); };
$('lyrAlerts').onchange = e => ['alerts-3d', 'alerts-line'].forEach(l => map.setLayoutProperty(l, 'visibility', e.target.checked ? 'visible' : 'none'));
$('radarMode').value = store.get('map3dRadar') || 'off';
$('radarMode').onchange = e => { store.set('map3dRadar', e.target.value); setRadarMode(e.target.value); };
$('lyrStorms').onchange = e => { ['cone-3d', 'cone-line', 'track-line', 'eye-3d'].forEach(l => map.setLayoutProperty(l, 'visibility', e.target.checked ? 'visible' : 'none')); renderStormLabels(); };
$('lyrTerrain').onchange = e => { map.setTerrain(e.target.checked ? { source: 'dem', exaggeration: 1.5 } : null); map.setLayoutProperty('hill', 'visibility', e.target.checked ? 'visible' : 'none'); };
$('scale').oninput = e => { scaleK = +e.target.value; rebuildAlerts(); rebuildCols(); };
let mt; map.on('moveend', () => { clearTimeout(mt); mt = setTimeout(renderLabels, 150); });
addEventListener('hashchange', () => { const h = location.hash.slice(1).toUpperCase(); if (h !== region) setRegion(h); });

// Tự làm mới: cảnh báo mỗi 3 phút, số liệu mỗi 10 phút, ảnh radar mỗi 5 phút
setInterval(loadAlerts, 3 * 60 * 1000);
setInterval(loadStorms, 15 * 60 * 1000);
setInterval(loadObs, 10 * 60 * 1000);
setInterval(() => {
  MRMS.forEach(ws => map.getSource(`radar-${ws}`)?.setTiles([wms(ws) + '&_t=' + Date.now()]));
  if (/^\d+$/.test(radarMode)) setRadarMode(radarMode);   // dựng lại vòng lặp radar với các khung giờ mới
}, 10 * 60 * 1000);

map.once('load', () => {
  const h = location.hash.slice(1).toUpperCase(), last = store.get('lastState');
  setRegion(STATES[h] ? h : h === 'US' ? 'US' : (STATES[last] ? last : 'US'));
  loadStorms();
  setRadarMode($('radarMode').value);
  if (/[?&]present\b/.test(location.search)) offerPresent();
});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
