# Lấy danh sách bão từ NHC mỗi 30 phút và lưu vào data/CurrentStorms.json,
# để app đọc cùng tên miền (tránh bị trình duyệt chặn khi gọi thẳng nhc.noaa.gov).
name: Cập nhật bão NHC
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nhc-storms
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tải CurrentStorms.json
        run: |
          curl -fsSL -A "us-weather-app (github actions)" https://www.nhc.noaa.gov/CurrentStorms.json -o /tmp/storms.json
          mkdir -p data
          python3 - <<'PY'
          import json, datetime
          d = json.load(open('/tmp/storms.json'))
          assert 'activeStorms' in d
          d['fetchedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds')
          json.dump(d, open('data/CurrentStorms.json', 'w'), ensure_ascii=False)
          PY
      - name: Lưu nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/CurrentStorms.json
          git diff --cached --quiet || git commit -m "Cập nhật dữ liệu bão NHC"
          git push
