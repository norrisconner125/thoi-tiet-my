<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bản Đồ Cảnh Báo NWS</title>
<meta name="description" content="Bản đồ cảnh báo hiện hành của NWS và số liệu quan trắc NOAA trên toàn nước Mỹ.">
<meta name="theme-color" content="#1d5fa8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: thanh điều khiển trên cùng; bản đồ chiếm phần lớn; bảng bên phải (máy tính) hoặc bên dưới (điện thoại) */
:root {
  --bg: #eef2f6; --surface: #ffffff; --line: #d5dde6; --fg: #142233; --muted: #5a6b7d;
  --accent: #1d5fa8; --accent-soft: #dce8f6;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1520; --surface: #152131; --line: #26364a; --fg: #e3ebf4; --muted: #8fa1b5; --accent: #6aa8eb; --accent-soft: #1c3350; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f-body); display: flex; flex-direction: column; }
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  padding-top: max(10px, env(safe-area-inset-top));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.bar h1 { margin: 0; font: 700 22px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }
.bar a.back { color: var(--accent); text-decoration: none; font-weight: 500; white-space: nowrap; }
.bar .grow { flex: 1; }
.ctl { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
select, button {
  padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  color: var(--fg); font: 500 13px var(--f-body); cursor: pointer;
}
button:hover, select:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; }
.chk input { accent-color: var(--accent); }

.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
#map { min-height: 0; background: var(--bg); }
aside { border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
@media (max-width: 860px) {
  body { height: auto; min-height: 100%; }
  .layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: 62vh auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .panel-body { max-height: none; }
}
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; border-radius: 0; padding: 11px 6px; background: none; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.panel-body { flex: 1; overflow: auto; padding: 12px 14px 20px; }
.meta { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
.empty { color: var(--muted); }

/* Danh sách cảnh báo */
.grp { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
.grp > summary { list-style: none; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; cursor: pointer; }
.grp > summary::-webkit-details-marker { display: none; }
.sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgb(0 0 0 / .25); }
.ev b { display: block; font-weight: 600; }
.ev small { color: var(--muted); font-size: 12px; }
.cnt { font: 600 13px var(--f-data); background: var(--accent-soft); border-radius: 10px; padding: 1px 8px; }
.item { border-top: 1px solid var(--line); padding: 8px 10px 8px 34px; cursor: pointer; font-size: 13px; }
.item:hover { background: var(--accent-soft); }
.item .area { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item small { color: var(--muted); }

/* Số liệu */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.stat:hover { border-color: var(--accent); }
.stat dt { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.stat dd { margin: 2px 0 0; font: 600 20px var(--f-data); font-variant-numeric: tabular-nums; }
.stat dd small { font: 400 12px var(--f-body); color: var(--muted); display: block; }
h3 { font: 600 14px var(--f-display); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 14px 0 6px; }
.rank { width: 100%; border-collapse: collapse; font-size: 13px; }
.rank td { padding: 5px 4px; border-top: 1px solid var(--line); cursor: pointer; }
.rank td:last-child { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.rank tr:hover td { background: var(--accent-soft); }

/* Chú giải */
.scale { display: flex; height: 14px; border-radius: 4px; overflow: hidden; margin: 6px 0 2px; }
.scale i { flex: 1; }
.scale-lab { display: flex; justify-content: space-between; font: 11px var(--f-data); color: var(--muted); }
.leg { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px 8px; align-items: center; font-size: 13px; }

/* Nhãn trạm quan trắc */
.obs { font: 600 11px/1 var(--f-data); padding: 3px 4px; border-radius: 4px; white-space: nowrap; box-shadow: 0 0 0 1px rgb(0 0 0 / .35); transform: translate(-50%, -50%); position: absolute; cursor: pointer; }
.obs .ar { display: inline-block; margin-right: 2px; }
.badge { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 13px var(--f-data); background: #c62828; border: 2px solid #fff; box-shadow: 0 1px 6px rgb(0 0 0 / .4); cursor: pointer; }
.badge.lo { background: #e08a00; }
.loading { position: absolute; z-index: 800; top: 12px; left: 56px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; padding: 5px 12px; font-size: 12px; box-shadow: 0 2px 8px rgb(0 0 0 / .15); }
.leaflet-container { font: 13px var(--f-body); }
.pop h4 { margin: 0 0 4px; font-size: 14px; }
.pop .a { border-left: 4px solid; padding: 2px 0 6px 8px; margin: 6px 0; }
.pop .a small { color: #555; }
.pop details { font-size: 12px; }
.pop details p { white-space: pre-line; max-height: 180px; overflow: auto; margin: 4px 0; }
.pop table { border-collapse: collapse; font-size: 12px; }
.pop td { padding: 1px 8px 1px 0; }
.pop code { display: block; font-size: 11px; background: #f1f3f5; color: #222; padding: 4px 6px; border-radius: 4px; margin-top: 6px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="./">← Thời Tiết Mỹ</a>
  <a class="back" id="link3d" href="map3d.html">Bản đồ 3D</a>
  <h1>Bản đồ cảnh báo</h1>
  <span class="grow"></span>
  <label class="ctl">Khu vực <select id="region" aria-label="Chọn khu vực"></select></label>
  <label class="ctl">Số liệu <select id="metric" aria-label="Chọn số liệu hiển thị">
    <option value="t">Nhiệt độ</option>
    <option value="td">Điểm sương</option>
    <option value="wspd">Gió</option>
    <option value="wgst">Gió giật</option>
    <option value="vis">Tầm nhìn</option>
    <option value="altim">Áp suất</option>
  </select></label>
  <label class="chk"><input type="checkbox" id="lyrAlerts" checked> Cảnh báo</label>
  <label class="chk"><input type="checkbox" id="lyrObs" checked> Số liệu</label>
  <label class="chk"><input type="checkbox" id="lyrRadar"> Radar</label>
  <button id="refresh" type="button">Làm mới</button>
</header>

<div class="layout">
  <div id="map" role="region" aria-label="Bản đồ cảnh báo và số liệu"></div>
  <aside>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="alerts" aria-selected="true">Cảnh báo <span id="alertCount"></span></button>
      <button type="button" role="tab" data-tab="data" aria-selected="false">Số liệu</button>
      <button type="button" role="tab" data-tab="legend" aria-selected="false">Chú giải</button>
    </div>
    <div class="panel-body" id="tab-alerts"></div>
    <div class="panel-body" id="tab-data" hidden></div>
    <div class="panel-body" id="tab-legend" hidden></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="noaa-common.js"></script>
<script>
// ---------- Bản đồ ----------
const map = L.map('map', { worldCopyJump: true, zoomSnap: 0.5 });
const esri = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
L.tileLayer(`${esri}${dark ? 'World_Dark_Gray_Base' : 'World_Light_Gray_Base'}/MapServer/tile/{z}/{y}/{x}`, { maxZoom: 16, attribution: 'Nền: Esri, HERE, Garmin, &copy; OpenStreetMap' }).addTo(map);
map.createPane('radar'); map.getPane('radar').style.zIndex = 350;
map.createPane('labels'); map.getPane('labels').style.zIndex = 450; map.getPane('labels').style.pointerEvents = 'none';
L.tileLayer(`${esri}${dark ? 'World_Dark_Gray_Reference' : 'World_Light_Gray_Reference'}/MapServer/tile/{z}/{y}/{x}`, { maxZoom: 16, pane: 'labels' }).addTo(map);
map.attributionControl.addAttribution('Cảnh báo: NWS · Số liệu: NOAA/NWS AWC (METAR)');

const radarLayer = L.layerGroup(['conus', 'alaska', 'hawaii', 'carib', 'guam'].map(ws =>
  L.tileLayer.wms(`https://opengeo.ncep.noaa.gov/geoserver/${ws}/${ws}_bref_qcd/ows`, {
    layers: `${ws}_bref_qcd`, format: 'image/png', transparent: true, version: '1.3.0', opacity: .55, pane: 'radar'
  })));
const alertLayer = L.layerGroup().addTo(map);
const badgeLayer = L.layerGroup().addTo(map);
const obsLayer = L.layerGroup().addTo(map);
const loadingEl = L.DomUtil.create('div', 'loading'); loadingEl.hidden = true; $('map').appendChild(loadingEl);
const setLoading = msg => { loadingEl.textContent = msg || ''; loadingEl.hidden = !msg; };

let region = 'US', gen = 0;
let alerts = [];          // [{id, p, rank, color, fg (featureGroup), geoms: []}]
let obs = [], obsSource = '';

// ---------- Cảnh báo ----------
async function loadAlerts() {
  const my = ++gen;
  setLoading('Đang tải cảnh báo NWS…');
  const url = region === 'US' ? `${NWS}/alerts/active?status=actual` : `${NWS}/alerts/active?status=actual&area=${region}`;
  let data;
  try { data = await nws(url); }
  catch (e) { setLoading(''); $('tab-alerts').innerHTML = `<p class="empty">Không tải được cảnh báo từ NWS (${esc(e.message)}). Bấm Làm mới để thử lại.</p>`; return; }
  if (my !== gen) return;

  alertLayer.clearLayers(); badgeLayer.clearLayers();
  alerts = data.features.map(f => ({
    id: f.id, p: f.properties, geometry: f.geometry, rank: rank(f.properties.event), color: eventColor(f.properties.event),
    fg: L.featureGroup(), geoms: []
  })).sort((a, b) => a.rank - b.rank);

  const style = a => ({ color: a.color, weight: a.rank < 100 ? 2.5 : 1.5, fillColor: a.color, fillOpacity: a.rank < 100 ? .35 : .22, interactive: false });
  const drawGeom = (a, g) => { a.geoms.push(g); L.geoJSON(g, { style: () => style(a), interactive: false }).addTo(a.fg); };

  // Cảnh báo có đa giác riêng (lốc xoáy, dông, lũ quét...) vẽ ngay
  alerts.forEach(a => { a.fg.addTo(alertLayer); if (a.geometry) drawGeom(a, a.geometry); });
  restack();
  renderAlertList();
  if (region === 'US') renderBadges();
  setLoading('');
  $('updated') && ($('updated').textContent = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }));

  // Khi xem một bang: tải hình dạng vùng cho các cảnh báo theo vùng hành chính
  if (region !== 'US') {
    const jobs = [];
    alerts.forEach(a => { if (!a.geometry) (a.p.affectedZones || []).forEach(z => jobs.push([a, z])); });
    let done = 0;
    if (jobs.length) setLoading(`Đang tải vùng cảnh báo 0/${jobs.length}…`);
    await pool(jobs, 6, async ([a, z]) => {
      const g = await getZone(z);
      if (my !== gen) return;
      if (g) drawGeom(a, g);
      done++;
      if (done % 10 === 0 || done === jobs.length) { setLoading(done < jobs.length ? `Đang tải vùng cảnh báo ${done}/${jobs.length}…` : ''); restack(); }
    });
    if (my === gen) { restack(); setLoading(''); }
  }
}
// Vẽ lại thứ tự: cảnh báo ít nguy hiểm ở dưới, nguy hiểm nhất ở trên
function restack() { [...alerts].reverse().forEach(a => a.fg.bringToFront()); }

function renderBadges() {
  const per = {};
  alerts.forEach(a => {
    const sts = new Set((a.p.geocode?.UGC || []).map(u => u.slice(0, 2)).filter(s => STATES[s]));
    sts.forEach(s => { (per[s] ||= { n: 0, warn: 0 }).n++; if (/Warning|Emergency/.test(a.p.event)) per[s].warn++; });
  });
  Object.entries(per).forEach(([st, v]) => {
    const icon = L.divIcon({ className: '', iconSize: [34, 34], html: `<div class="badge${v.warn ? '' : ' lo'}" title="${STATES[st][0]}: ${v.n} cảnh báo">${v.n}</div>` });
    L.marker(stateCenter(st), { icon, keyboard: true, title: `${STATES[st][0]}: ${v.n} cảnh báo` })
      .on('click', () => setRegion(st)).addTo(badgeLayer);
  });
}

function renderAlertList() {
  $('alertCount').textContent = alerts.length ? `(${alerts.length})` : '';
  if (!alerts.length) {
    $('tab-alerts').innerHTML = `<p class="empty">Hiện không có cảnh báo nào đang hiệu lực ${region === 'US' ? 'trên toàn nước Mỹ' : 'tại ' + STATES[region][0]}.</p>`;
    return;
  }
  const groups = new Map();
  alerts.forEach(a => { if (!groups.has(a.p.event)) groups.set(a.p.event, []); groups.get(a.p.event).push(a); });
  const intro = region === 'US'
    ? '<p class="meta">Toàn quốc: bản đồ vẽ các cảnh báo có đa giác riêng (lốc xoáy, dông, lũ quét…). Số trên mỗi bang là tổng số cảnh báo; bấm vào số hoặc chọn bang để xem đầy đủ các vùng.</p>'
    : `<p class="meta">${STATES[region][0]} · bấm một điểm trên bản đồ để xem mọi cảnh báo tại đó.</p>`;
  $('tab-alerts').innerHTML = intro + [...groups].map(([ev, list], gi) => `
    <details class="grp"${gi < 3 ? ' open' : ''}>
      <summary><span class="sw" style="background:${list[0].color}"></span>
        <span class="ev"><b>${esc(eventVi(ev))}</b><small>${esc(ev)}</small></span><span class="cnt">${list.length}</span></summary>
      ${list.map(a => `<div class="item" data-id="${esc(a.id)}" tabindex="0"><div class="area">${esc(a.p.areaDesc)}</div>
        <small>${a.p.ends || a.p.expires ? 'Đến ' + fmtTime(a.p.ends || a.p.expires) : ''} · ${esc(a.p.senderName || '')}</small></div>`).join('')}
    </details>`).join('');
}
function focusAlert(id) {
  const a = alerts.find(x => x.id === id); if (!a) return;
  const b = a.fg.getBounds();
  if (b.isValid()) map.fitBounds(b, { padding: [30, 30], maxZoom: 9 });
  else if (region === 'US') {
    const st = (a.p.geocode?.UGC || []).map(u => u.slice(0, 2)).find(s => STATES[s]);
    if (st) { setRegion(st); return; }
  }
  const c = b.isValid() ? b.getCenter() : map.getCenter();
  L.popup({ maxWidth: 340 }).setLatLng(c).setContent(alertPopup([a], false)).openOn(map);
}
$('tab-alerts').addEventListener('click', e => { const it = e.target.closest('.item'); if (it) focusAlert(it.dataset.id); });
$('tab-alerts').addEventListener('keydown', e => { if (e.key === 'Enter') { const it = e.target.closest('.item'); if (it) focusAlert(it.dataset.id); } });

function alertPopup(list, here = true) {
  return `<div class="pop">${here ? `<h4>${list.length} cảnh báo tại điểm này</h4>` : ''}${list.map(a => `
    <div class="a" style="border-color:${a.color}"><b>${esc(eventVi(a.p.event))}</b> <small>(${esc(a.p.event)})</small><br>
      <small>${a.p.onset ? 'Từ ' + fmtTime(a.p.onset) + ' · ' : ''}${a.p.ends || a.p.expires ? 'đến ' + fmtTime(a.p.ends || a.p.expires) : ''}<br>${esc(a.p.senderName || '')}</small>
      <details><summary>Chi tiết (tiếng Anh)</summary><p><b>${esc(a.p.headline || '')}</b>\n\n${esc(a.p.description || '')}${a.p.instruction ? '\n\nHƯỚNG DẪN: ' + esc(a.p.instruction) : ''}</p></details>
    </div>`).join('')}</div>`;
}

// Bấm vào bản đồ: tìm mọi cảnh báo chứa điểm đó (thuật toán tia cắt)
function inRing(pt, ring) {
  let ins = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) ins = !ins;
  }
  return ins;
}
function inGeom(pt, g) {
  const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates
    : g.type === 'GeometryCollection' ? g.geometries.flatMap(x => x.type === 'Polygon' ? [x.coordinates] : x.type === 'MultiPolygon' ? x.coordinates : []) : [];
  return polys.some(p => inRing(pt, p[0]) && !p.slice(1).some(h => inRing(pt, h)));
}
map.on('click', e => {
  if (!map.hasLayer(alertLayer)) return;
  const pt = [e.latlng.lng, e.latlng.lat];
  const hits = alerts.filter(a => a.geoms.some(g => inGeom(pt, g)));
  if (hits.length) L.popup({ maxWidth: 340 }).setLatLng(e.latlng).setContent(alertPopup(hits)).openOn(map);
});

async function loadObs() {
  const r = await fetchObs(regionBBox(region));
  obs = r.list; obsSource = r.source;
  renderObs(); renderData(); renderLegend();
}
let metric = store.get('mapMetric') || 't';

// Hiện số liệu, tránh chồng chéo: mỗi ô lưới ~46px chỉ hiện một trạm
function renderObs() {
  obsLayer.clearLayers();
  if (!map.hasLayer(obsLayer)) return;
  const M = METRICS[metric], bounds = map.getBounds().pad(0.05), used = new Set(), cell = 46;
  const cand = obs.filter(o => M.get(o) != null && bounds.contains([o.lat, o.lon]));
  // Ưu tiên giá trị cực trị để không bị ẩn mất
  cand.sort((a, b) => Math.abs(M.get(b) - 50) - Math.abs(M.get(a) - 50));
  for (const o of cand) {
    const p = map.latLngToContainerPoint([o.lat, o.lon]);
    const key = Math.floor(p.x / cell) + ':' + Math.floor(p.y / (cell * 0.6));
    if (used.has(key)) continue;
    used.add(key);
    const v = M.get(o), bg = colorAt(M.stops, v);
    const arrow = (metric === 'wspd' || metric === 'wgst') && o.wdir != null && o.wspd > 0
      ? `<span class="ar" style="transform:rotate(${o.wdir + 180}deg)">↑</span>` : '';
    const icon = L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="obs" style="background:${bg};color:${textOn(bg)}">${arrow}${M.fmt(v)}</div>` });
    L.marker([o.lat, o.lon], { icon, keyboard: false, title: o.id }).bindPopup(() => obsPopup(o), { maxWidth: 320 }).addTo(obsLayer);
  }
}
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 60 ? `${m} phút trước` : `${Math.floor(m / 60)} giờ ${m % 60} phút trước`; };
function obsPopup(o) {
  const T = METRICS.t, rh = o.t != null && o.td != null ? Math.round(100 * Math.exp(17.625 * o.td / (243.04 + o.td)) / Math.exp(17.625 * o.t / (243.04 + o.t))) : null;
  const rows = [
    ['Nhiệt độ', o.t != null ? T.fmt(T.get(o)) + unit : '—'],
    ['Điểm sương', o.td != null ? METRICS.td.fmt(METRICS.td.get(o)) + unit : '—'],
    ['Độ ẩm', rh != null ? rh + '%' : '—'],
    ['Gió', o.wspd != null ? (o.wspd === 0 ? 'Lặng gió' : `${Math.round(o.wspd * 1.15078)} mph${o.wdir != null ? ' từ ' + o.wdir + '°' : ' (đổi hướng)'}`) : '—'],
    ['Gió giật', o.wgst ? Math.round(o.wgst * 1.15078) + ' mph' : '—'],
    ['Tầm nhìn', o.vis != null ? METRICS.vis.fmt(o.vis) + ' dặm' : '—'],
    ['Áp suất', o.altim != null ? o.altim.toFixed(2) + ' inHg' : '—'],
    ['Hiện tượng', o.wx || '—'],
    ['Điều kiện bay', o.cat || '—']
  ];
  return `<div class="pop"><h4>${esc(o.id)}${o.name ? ' · ' + esc(o.name) : ''}</h4><small>Quan trắc ${ago(o.time)}</small>
    <table>${rows.map(([k, v]) => `<tr><td>${k}</td><td><b>${esc(v)}</b></td></tr>`).join('')}</table>
    ${o.raw ? `<code>${esc(o.raw)}</code>` : ''}
    <a href="https://forecast.weather.gov/MapClick.php?lat=${o.lat}&lon=${o.lon}" target="_blank" rel="noopener">Dự báo NWS tại đây ↗</a></div>`;
}
function openObs(id) {
  const o = obs.find(x => x.id === id); if (!o) return;
  map.setView([o.lat, o.lon], Math.max(map.getZoom(), 8));
  L.popup({ maxWidth: 320 }).setLatLng([o.lat, o.lon]).setContent(obsPopup(o)).openOn(map);
}

// Bảng thống kê cho vùng đang nhìn thấy
function renderData() {
  const b = map.getBounds();
  const vis = obs.filter(o => b.contains([o.lat, o.lon]));
  if (!obs.length) { $('tab-data').innerHTML = '<p class="empty">Không tải được số liệu quan trắc. Bấm Làm mới để thử lại.</p>'; return; }
  const T = METRICS.t, G = METRICS.wgst;
  const by = (f, dir) => vis.filter(o => f(o) != null).sort((a, c) => dir * (f(c) - f(a)));
  const hot = by(T.get, 1), cold = by(T.get, -1), gust = by(o => o.wgst ?? o.wspd, 1), fog = by(o => o.vis, -1);
  const temps = vis.map(T.get).filter(v => v != null);
  const avg = temps.length ? temps.reduce((s, v) => s + v, 0) / temps.length : null;
  const stat = (label, o, val) => o ? `<div class="stat" data-id="${esc(o.id)}"><dt>${label}</dt><dd>${val}<small>${esc(o.id)}${o.name ? ' · ' + esc(o.name) : ''}</small></dd></div>` : '';
  const table = (title, list, f) => list.length ? `<h3>${title}</h3><table class="rank">${list.slice(0, 6).map(o =>
    `<tr data-id="${esc(o.id)}"><td>${esc(o.id)}${o.name ? ' · ' + esc(o.name) : ''}</td><td>${f(o)}</td></tr>`).join('')}</table>` : '';
  $('tab-data').innerHTML = `
    <p class="meta">${vis.length} trạm trong khung nhìn${obsSource ? ' · nguồn: ' + esc(obsSource) : ''}. Kéo/zoom bản đồ để thống kê vùng khác.</p>
    <div class="stats">
      ${stat('Nóng nhất', hot[0], hot[0] && T.fmt(T.get(hot[0])) + unit)}
      ${stat('Lạnh nhất', cold[0], cold[0] && T.fmt(T.get(cold[0])) + unit)}
      ${stat('Gió mạnh nhất', gust[0], gust[0] && Math.round((gust[0].wgst ?? gust[0].wspd) * 1.15078) + ' mph')}
      <div class="stat"><dt>Nhiệt độ trung bình</dt><dd>${avg != null ? Math.round(avg) + '°' + unit : '—'}<small>${temps.length} trạm</small></dd></div>
    </div>
    ${table('Nóng nhất', hot, o => T.fmt(T.get(o)) + unit)}
    ${table('Lạnh nhất', cold, o => T.fmt(T.get(o)) + unit)}
    ${table('Gió giật mạnh nhất', gust.filter(o => o.wgst), o => Math.round(o.wgst * 1.15078) + ' mph')}
    ${table('Tầm nhìn kém nhất', fog.filter(o => o.vis < 5), o => METRICS.vis.fmt(o.vis) + ' dặm' + (o.wx ? ' · ' + esc(o.wx) : ''))}`;
}
$('tab-data').addEventListener('click', e => { const r = e.target.closest('[data-id]'); if (r) openObs(r.dataset.id); });

function renderLegend() {
  const M = METRICS[metric];
  const lo = M.stops[0][0], hi = M.stops[M.stops.length - 1][0];
  const steps = Array.from({ length: 24 }, (_, i) => colorAt(M.stops, lo + (hi - lo) * i / 23));
  const evs = [...new Set(alerts.map(a => a.p.event))];
  $('tab-legend').innerHTML = `
    <h3 style="margin-top:0">${M.name} (${M.unit})</h3>
    <div class="scale">${steps.map(c => `<i style="background:${c}"></i>`).join('')}</div>
    <div class="scale-lab"><span>${lo}</span><span>${(lo + hi) / 2}</span><span>${hi}</span></div>
    <p class="meta" style="margin-top:8px">Số liệu quan trắc bề mặt (METAR) tại sân bay, thường cập nhật mỗi giờ. Bấm vào một con số để xem chi tiết và bản tin gốc.${metric === 'wspd' || metric === 'wgst' ? ' Mũi tên chỉ hướng gió thổi tới.' : ''}</p>
    <h3>Cảnh báo đang hiện trên bản đồ</h3>
    ${evs.length ? `<div class="leg">${evs.map(e => `<span class="sw" style="background:${eventColor(e)}"></span><span>${esc(eventVi(e))} <small style="color:var(--muted)">· ${esc(e)}</small></span>`).join('')}</div>` : '<p class="empty">Không có.</p>'}
    <p class="meta" style="margin-top:10px">Màu theo bảng màu cảnh báo chính thức của NWS. Warning = cảnh báo (đang/sắp xảy ra), Watch = theo dõi (có khả năng xảy ra), Advisory = khuyến cáo (ít nguy hiểm hơn).</p>`;
}

// ---------- Điều khiển ----------
const sel = $('region');
sel.innerHTML = '<option value="US">Toàn nước Mỹ</option>' + Object.entries(STATES).sort((a, b) => a[1][0].localeCompare(b[1][0]))
  .map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('');
function fitRegion() {
  if (region === 'US') map.fitBounds([[24, -125], [49.5, -66.5]]);
  else { const s = STATES[region]; map.fitBounds([[s[1], s[2]], [s[3], s[4]]], { padding: [10, 10] }); }
}
function setRegion(r) {
  region = STATES[r] ? r : 'US';
  sel.value = region;
  if (location.hash.slice(1) !== region) history.replaceState(null, '', '#' + region);
  $('link3d').href = 'map3d.html#' + region;
  fitRegion();
  loadAll();
}
function loadAll() { loadAlerts().then(renderLegend); loadObs(); }
sel.onchange = () => setRegion(sel.value);
$('metric').value = metric;
$('metric').onchange = e => { metric = e.target.value; store.set('mapMetric', metric); renderObs(); renderLegend(); };
$('lyrAlerts').onchange = e => { e.target.checked ? (alertLayer.addTo(map), badgeLayer.addTo(map)) : (alertLayer.remove(), badgeLayer.remove()); };
$('lyrObs').onchange = e => { e.target.checked ? obsLayer.addTo(map) : obsLayer.remove(); renderObs(); };
$('lyrRadar').onchange = e => { e.target.checked ? radarLayer.addTo(map) : radarLayer.remove(); };
$('refresh').onclick = () => { radarLayer.eachLayer(l => l.setParams({ _t: Date.now() })); loadAll(); };
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  ['alerts', 'data', 'legend'].forEach(t => $('tab-' + t).hidden = t !== b.dataset.tab);
});
let moveT;
map.on('moveend', () => { clearTimeout(moveT); moveT = setTimeout(() => { renderObs(); renderData(); }, 120); });
addEventListener('hashchange', () => { const h = location.hash.slice(1).toUpperCase(); if (h !== region) setRegion(h); });

// Tự làm mới: cảnh báo mỗi 3 phút, số liệu mỗi 10 phút
setInterval(() => loadAlerts().then(renderLegend), 3 * 60 * 1000);
setInterval(loadObs, 10 * 60 * 1000);

// Khu vực ban đầu: theo đường dẫn (#TX), nếu không có thì theo thành phố đã xem ở trang chính
const fromHash = location.hash.slice(1).toUpperCase();
const fromLast = store.get('lastState');
setRegion(STATES[fromHash] ? fromHash : fromHash === 'US' ? 'US' : (STATES[fromLast] ? fromLast : 'US'));

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
